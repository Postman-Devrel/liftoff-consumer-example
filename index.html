<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postman Liftoff — Learning Paths & Modules</title>
  <style>
    :root {
      --bg: #0F0F0F;
      --surface: #1A1A1A;
      --surface-hover: #242424;
      --border: #2A2A2A;
      --text: #E5E5E5;
      --text-muted: #999;
      --accent: #FF6C37;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    header .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .search-bar {
      margin-bottom: 2rem;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    section {
      margin-bottom: 3rem;
    }

    section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .count-badge {
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: #3a3a3a;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-icon {
      font-size: 1.75rem;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .loading, .error {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .error { color: #ef4444; }

    .badge-img {
      height: 40px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🚀 Liftoff</span>
  <span class="subtitle">Learning Paths & Modules</span>
</header>

<main>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Search learning paths and modules…">
  </div>

  <section id="paths-section">
    <h2>Learning Paths <span class="count-badge" id="paths-count"></span></h2>
    <div class="grid" id="paths-grid">
      <div class="loading">Loading learning paths…</div>
    </div>
  </section>

  <section id="modules-section">
    <h2>Modules <span class="count-badge" id="modules-count"></span></h2>
    <div class="grid" id="modules-grid">
      <div class="loading">Loading modules…</div>
    </div>
  </section>
</main>

<script>
  const API_BASE = 'https://www.postman.com/liftoff/api/content';

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
  }

  function renderCard(item, type) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = item.url;
    card.target = '_blank';
    card.rel = 'noopener';

    const countLabel = type === 'path'
      ? `${item.moduleCount} modules`
      : `${item.lessonCount} lessons`;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="background:${item.color}20; color:${item.color}">
          ${item.icon}
        </div>
        <div class="card-title">${item.title}</div>
      </div>
      <div class="card-desc">${item.description}</div>
      <div class="card-meta">
        <span>📚 ${countLabel}</span>
        <span>🧩 ${item.stepCount} steps</span>
        <span>⭐ ${item.totalPoints} pts</span>
      </div>
    `;
    return card;
  }

  function renderGrid(container, items, type) {
    container.innerHTML = '';
    if (items.length === 0) {
      container.innerHTML = '<div class="loading">No results found.</div>';
      return;
    }
    items.forEach(item => container.appendChild(renderCard(item, type)));
  }

  let allPaths = [];
  let allModules = [];

  async function loadData(query = '') {
    const qs = query ? `?q=${encodeURIComponent(query)}` : '';

    const pathsGrid = document.getElementById('paths-grid');
    const modulesGrid = document.getElementById('modules-grid');

    try {
      const [pathsData, modulesData] = await Promise.all([
        fetchJSON(`${API_BASE}/learning-paths${qs}`),
        fetchJSON(`${API_BASE}/modules${qs}`)
      ]);

      allPaths = pathsData.learningPaths;
      allModules = modulesData.modules;

      document.getElementById('paths-count').textContent = pathsData.total;
      document.getElementById('modules-count').textContent = modulesData.total;

      renderGrid(pathsGrid, allPaths, 'path');
      renderGrid(modulesGrid, allModules, 'module');
    } catch (err) {
      pathsGrid.innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
      modulesGrid.innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
    }
  }

  let debounceTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadData(e.target.value), 300);
  });

  loadData();
</script>

</body>
</html>
